<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>企业微信第三方应用首页</title>
</head>
<body>
<h1>前端页面</h1>
<div id="userInfo">正在获取用户信息...</div>

<script>
    // 解析 URL 参数
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    const code = getQueryParam('code');
    if (code) {
        fetch(`/wx/tp/getUserInfo?code=${code}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('userInfo').innerText = '欢迎，用户ID：' + data.userId + '，企业ID：' + data.corpId;
            })
            .catch(error => {
                document.getElementById('userInfo').innerText = '获取用户信息失败：' + error;
            });
    } else {
        document.getElementById('userInfo').innerText = '未获取到 code 参数';
    }
</script>
</body>
</html>
